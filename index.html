<style>#boot{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:var(--bg,#000);transition:opacity .35s}#boot.out{opacity:0;pointer-events:none}#boot div{display:flex;flex-direction:column;align-items:center;gap:16px;font:600 13px "Plus Jakarta Sans",Inter,system-ui,sans-serif;color:var(--mu,#9fb1ce)}#boot svg{width:56px;height:56px;color:var(--ac,#a8c8ff);animation:bs 3s linear infinite}@keyframes bs{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#boot svg{animation:none}}</style>

<noscript><p style="font:15px Inter,system-ui,sans-serif;color:#eee;background:#060606;padding:32px;position:fixed;inset:0;z-index:1000;margin:0">Wishwa needs JavaScript to run.</p></noscript>
<script>
/* Master file: pulls the markup (ui.html) into the page, then starts the app (app.js). */
(function(){
  function fail(msg){
    document.body.innerHTML='<div style="font:15px/1.6 Inter,system-ui,sans-serif;color:#eee;background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"><div style="max-width:520px"><h2 style="margin:0 0 8px">Wishwa could not start</h2><p style="color:#aaa;margin:0 0 12px">'+msg+'</p><code style="background:#161616;padding:8px 12px;border-radius:8px;display:inline-block">python3 -m http.server 8000</code><p style="color:#777;font-size:13px">then open http://localhost:8000</p></div></div>';
  }
  fetch('ui.html').then(function(r){
    if(!r.ok) throw new Error('ui.html returned '+r.status);
    return r.text();
  }).then(function(markup){
    document.body.insertAdjacentHTML('afterbegin',markup);
    var s=document.createElement('script');
    s.src='app.js';
    s.onload=function(){var b=document.getElementById('boot');if(b){b.classList.add('out');setTimeout(function(){b.remove()},400)}};
    s.onerror=function(){fail('app.js failed to load.')};
    document.body.appendChild(s);
  }).catch(function(){
    fail('The page loads its parts (ui.html, styles.css, app.js) with fetch, which browsers block on file:// URLs. Run a tiny local server from this folder:');
  });
})();
</script>
